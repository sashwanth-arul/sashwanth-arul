# GitHub Action for generating a contribution graph with a snake eating your contributions.
name: Generate Snake

# Controls when the action will run.
on:
  # Every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # Allows manual execution from the Actions tab
  workflow_dispatch:

  # Also run whenever main is updated
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Clone repo
        uses: actions/checkout@v4

      # Generate snake files
      - name: Generate the snake files in ./dist/
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=00E5FF&color_dots=#00FF88,#00E5FF,#4B91F1,#8DBDFF,#3C7DD9

      # Push generated files to output branch
      - name: Push new files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update snake animations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
